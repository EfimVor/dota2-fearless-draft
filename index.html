<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 — Fearless Draft</title>
    <link rel="stylesheet" href="style.css?v=9">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🗡️</text></svg>">
</head>
<body>
    <!-- ... unchanged background, connection bar, header, modals ... -->

    <!-- Main Draft Area -->
    <main class="main-content">
        <aside class="team-panel radiant-panel" id="radiantPanel">
            <!-- ... unchanged ... -->
            <div class="turn-indicator radiant-turn hidden" id="radiantTurn">
                <span class="pulse-dot"></span> Ваш ход
            </div>
        </aside>

        <section class="hero-pool" id="heroPool">
            <!-- ... unchanged attribute columns ... -->
        </section>

        <aside class="team-panel dire-panel" id="direPanel">
            <!-- ... unchanged ... -->
            <div class="turn-indicator dire-turn hidden" id="direTurn">
                <span class="pulse-dot"></span> Ваш ход
            </div>
        </aside>
    </main>

    <!-- Bottom History Panel (renamed) -->
    <section class="history-section" id="historySection">
        <div class="history-header">
            <span class="history-title">📋 Прошлые пики</span>
        </div>
        <div class="history-scroll" id="historyScroll">
            <p class="text-muted">Нет завершённых игр</p>
        </div>
    </section>

    <!-- ... footer controls with timer ... -->
    <script src="game.js?v=4"></script>

</html>
