<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 — Fearless Draft</title>
    <link rel="stylesheet" href="style.css?v=33">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🗡️</text></svg>">
</head>
<body>
    <div class="bg-layer">
        <div class="bg-glow bg-glow-radiant"></div>
        <div class="bg-glow bg-glow-dire"></div>
        <div class="bg-particles" id="bgParticles"></div>
    </div>
    <div class="connection-bar" id="connectionBar">
        <div class="conn-status" id="connStatus">
            <span class="conn-dot disconnected"></span>
            <span class="conn-text" id="connText">Не подключен</span>
        </div>
        <div class="conn-actions">
            <button class="btn btn-primary" id="btnCreateRoom">🎯 Создать комнату</button>
            <div class="join-group">
                <input type="text" class="setting-input conn-input" id="joinRoomInput" placeholder="Код комнаты" maxlength="6">
                <button class="btn btn-glass" id="btnJoinRoom">🔗 Подключиться</button>
            </div>
        </div>
        <div class="conn-info" id="connInfo">
            <span class="room-code-label">Комната:</span>
            <span class="room-code-value" id="roomCodeDisplay">—</span>
            <button class="btn btn-mini btn-copy" id="btnCopyLink" title="Копировать ссылку">📋</button>
            <button class="btn btn-danger btn-sm" id="btnLeaveRoom" title="Выйти из комнаты">🚪 Выйти</button>
        </div>
    </div>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">🗡️</span>
                <div class="logo-text-group">
                    <span class="logo-title">FEARLESS DRAFT</span>
                    <span class="logo-subtitle">Dota 2</span>
                </div>
            </div>
            <span class="game-badge" id="gameBadge">Игра 1</span>
